name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (test-support)
        run: cargo clippy --all-targets --features test-support -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Most credential cases use the test-only store. The native Windows case
      # creates and removes one uniquely named synthetic Credential Manager entry.
      - name: Run tests
        id: native_tests
        run: cargo test --features test-support --no-fail-fast
      - name: Native macOS login-Keychain update continuity
        if: runner.os == 'macOS'
        run: >-
          cargo test --features test-support --locked --test update
          macos_login_keychain::installer_and_update_preserve_login_keychain_authorization
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Windows lint (both provider configurations)
        if: runner.os == 'Windows'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features test-support -- -D warnings
      - name: Native Windows OpenSSH loopback fixture
        if: runner.os == 'Windows'
        run: |
          python -m pip install paramiko==4.0.0
          python tests/windows_lab/ssh.py
      - name: Native Windows focused-input fixture
        if: runner.os == 'Windows' && !cancelled() && steps.native_tests.outcome == 'success'
        run: pwsh -NoProfile -STA -File tests/windows_lab/desktop.ps1

  sudo-integration:
    name: Isolated Linux sudo and SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # All accounts, passwords, host keys and sudoers rules belong to the
      # disposable containers. The job never modifies the runner's sudo policy.
      - name: Measure installed sudo and OpenSSH behavior
        run: bash tests/sudo_lab/run.sh --output-dir "$RUNNER_TEMP/sudo-compatibility"
      # The lab's pinned Rust image builds into target/lab with the Cargo
      # registry mounted; rust-cache keeps both between runs, so only changed
      # crates compile instead of every dependency inside Docker.
      - name: Build and verify local sudo execution
        run: python3 tests/sudo_execution_lab/run.py --cached-build
      - name: Verify SSH login and remote sudo execution
        run: >-
          docker run --rm --network none
          --hostname agentenv-sudo-lab --add-host agentenv-sudo-lab:127.0.0.1
          --entrypoint python3 agentenv-sudo-execution:lab /opt/sudo-lab/verify_ssh.py
      - name: Verify sudo policy variations and SSH refusal cases
        run: >-
          docker run --rm --network none
          --hostname agentenv-sudo-lab --add-host agentenv-sudo-lab:127.0.0.1
          --entrypoint python3 agentenv-sudo-execution:lab /opt/sudo-lab/verify_release.py
