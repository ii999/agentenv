name: Windows port workspace

on:
  push:
    branches: [windows-sudo-credential-fill]
    paths: [.github/workflows/port-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Package cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix
          mkdir -p "$RUNNER_TEMP/cross"
          tar -czf "$RUNNER_TEMP/cross/mingw.tar.gz" -C / usr/x86_64-w64-mingw32 usr/share/mingw-w64 usr/lib/gcc/x86_64-w64-mingw32 usr/libexec/gcc/x86_64-w64-mingw32 usr/bin/x86_64-w64-mingw32-*
      - uses: actions/upload-artifact@v4
        with:
          name: agentenv-cross-compiler
          path: ${{ runner.temp }}/cross
          retention-days: 1
