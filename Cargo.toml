[package]
name = "agentenv"
version = "0.4.1"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = "4"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "accesskit", "clipboard", "x11", "wayland"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
# `update` replaces the running executable in place (self-replace), compares
# release tags (semver), downloads over HTTPS with bundled roots (ureq), and
# unpacks the platform archive (flate2 + tar on Unix, zip on Windows).
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps JSON number literals as strings so config::write
# can refuse out-of-range integer literals instead of lossy floats. It makes
# serde_json::Number opaque: do not use #[serde(untagged)]/#[serde(flatten)]
# over numbers or compare Number values structurally while it is on.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# Fingerprints the exact bytes of a project file for the trust store
# (project::trust); a content change is what returns a file to untrusted.
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "io-std", "sync", "time", "signal"] }
# The credential-fill CDP backend speaks the Chrome DevTools Protocol over a
# loopback WebSocket; no TLS feature is enabled because remote endpoints are
# out of scope until a connection-credential design exists.
# Dependencies log through the `log` facade; tungstenite traces frame
# payloads. No logger is installed, and these features make that permanent.
log = { version = "0.4", default-features = false, features = ["max_level_off", "release_max_level_off"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
ureq = "3"

# The target process for the `run` integration tests. It reports the child
# environment the injection runner builds, which no library API can expose:
# `run` replaces agentenv with its target. See tests/fixtures/bin/probe.rs.
[[bin]]
name = "test-probe"
path = "tests/fixtures/bin/probe.rs"

# Release executables ship prebuilt; whole-program optimization trades build
# time for smaller, faster binaries and does not affect `cargo build`.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[features]
test-keychain = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# The credential dialog places a system glass backdrop behind its window. These
# are the AppKit binding versions eframe already links on macOS.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop libraries load only when a dialog opens; headless CLI executables
# retain the release pipeline's libc-only dynamic-link baseline.
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }
xkbcommon-dl = "0.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.8"
