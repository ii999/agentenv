[package]
name = "agentenv"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = "4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }

# The target process for the `run` integration tests. It reports the child
# environment the injection runner builds, which no library API can expose:
# `run` replaces agentenv with its target. See tests/fixtures/bin/probe.rs.
[[bin]]
name = "test-probe"
path = "tests/fixtures/bin/probe.rs"

[features]
test-keychain = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.8"
