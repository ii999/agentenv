[package]
name = "cdp-fill-lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Rust CDP filling client prototype for the credential-fill Phase A lab"

[[bin]]
name = "cdp-fill-native"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
ureq = { version = "3", default-features = false }
